name: Build FoldX + Duo

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài công cụ
        run: brew install ldid dpkg make xz

      - name: Tải Theos (roothide)
        run: |
          git clone --recursive https://github.com/roothide/theos "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Tải SDK iOS
        run: |
          git clone --depth=1 https://github.com/theos/sdks "$HOME/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME"/sdks/*.sdk "$HOME/theos/sdks/"

      - name: Giải nén và build FoldX
        run: |
          unzip -q FoldX-source.zip
          cd FoldX
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1

      - name: Gộp với deb Duo
        run: |
          DUO="$(ls ./*.deb | head -1)"
          FOLD="$(ls FoldX/packages/*.deb | head -1)"
          echo "Duo: $DUO"
          echo "FoldX: $FOLD"
          mkdir -p out
          bash FoldX/merge.sh "$DUO" "$FOLD" out/IphoneDuo-FoldX-gop.deb
          cp "$FOLD" out/FoldX-rieng.deb

      - name: Lưu file .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-gop
          path: out/*.deb
