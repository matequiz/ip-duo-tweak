name: Build FoldX

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài công cụ
        run: brew install ldid dpkg make xz

      - name: Tải Theos (roothide)
        run: |
          git clone --recursive https://github.com/roothide/theos "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Tải SDK iOS
        run: |
          git clone --depth=1 https://github.com/theos/sdks "$HOME/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME"/sdks/*.sdk "$HOME/theos/sdks/"

      - name: Giải nén và build
        run: |
          unzip -q FoldX-source.zip
          cd FoldX
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1

      - name: Lưu file .deb
        uses: actions/upload-artifact@v4
        with:
          name: FoldX-deb
          path: FoldX/packages/*.deb
